# /etc/nginx/sites-available/kick-sync  (luego: ln -s a sites-enabled)
server {
    listen 80;
    server_name localhost;  # cambia por tu dominio

    location / {
        proxy_pass http://127.0.0.1:3000;  # mismo puerto que PORT en el .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Obligatorio $remote_addr (no $proxy_add_x_forwarded_for): evita que se falsee la IP y se salte el rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Obligatorio para el tiempo real (SSE)
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
